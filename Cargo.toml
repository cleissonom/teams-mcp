[package]
name = "teams-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Read-only Teams MCP with managed headless Chrome and existing browser or app sessions"
license = "MIT"
readme = "README.md"
keywords = ["mcp", "teams", "stdio"]
categories = ["command-line-utilities"]
include = [
    "/src/**/*.rs", "/src/bridge.js", "/tests/**/*.rs", "/tests/*.cjs", "/tests/test_*.py",
    "/scripts/*.py", "/examples/*.json", "/examples/*.toml", "/docs/*.md",
    "/.github/workflows/ci.yml", "/.github/workflows/release.yml", "/.gitignore", "/AGENTS.md", "/README.md",
    "/CONTRIBUTING.md", "/SECURITY.md", "/LICENSE", "/NOTICE", "/release-files.txt",
    "/Cargo.toml", "/Cargo.lock",
]

[dependencies]
rmcp = { version = "3.8.0", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt", "time", "net", "io-util", "io-std", "fs", "signal", "process"] }
tokio-tungstenite = "0.28"
futures-util = { version = "0.3", features = ["sink"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["std"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
# Hostnames are compared as exact ASCII; this stub IDNA back end avoids the ICU4X data tree.
idna_adapter = "=1.0.0"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["process"] }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
